name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run check:version "$RELEASE_TAG"
      - run: bun run typecheck
      - run: bun run test
      - run: npm pack --dry-run
      - name: Pack release
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const [pack] = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pack.json`, "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${pack.filename}\n`);
          '
      - name: Publish to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --provenance --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release create "$RELEASE_TAG" "$TARBALL" --verify-tag --generate-notes
