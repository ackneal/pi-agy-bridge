name: ACP Registry Check

on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ACP Registry Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare local registry.json with upstream
        env:
          UPSTREAM_URL: ${{ vars.ACP_REGISTRY_UPSTREAM_URL }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { isDeepStrictEqual } from "node:util";

            const localPath = "src/extension/drivers/acp/registry.json";
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            const note = (line) => summaryPath && appendFileSync(summaryPath, `${line}\n`);
            const escape = (msg) => msg.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const url = process.env.UPSTREAM_URL?.trim();

            if (!url) {
              console.log("::notice::ACP_REGISTRY_UPSTREAM_URL is not set; skipping upstream check.");
              note("- **ACP registry check:** skipped (`ACP_REGISTRY_UPSTREAM_URL` is not set).");
              process.exit(0);
            }

            try {
              const local = JSON.parse(readFileSync(localPath, "utf8"));
              const res = await fetch(url, { signal: AbortSignal.timeout(10_000) });
              if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`.trim());
              const upstream = await res.json();

              if (isDeepStrictEqual(local, upstream)) {
                const msg = `ACP registry matches upstream (version ${local.version}).`;
                console.log(msg);
                note(`- **ACP registry check:** ${msg}`);
              } else {
                const msg = `Local ACP registry (${local.version}) differs from upstream (${upstream.version}).`;
                console.log(`::warning file=${localPath},title=ACP registry differs from upstream::${escape(msg)}`);
                note(`- **ACP registry check:** ⚠️ ${msg}`);
              }
            } catch (err) {
              const reason = err instanceof Error ? err.message : String(err);
              console.log(`::warning title=ACP registry check skipped::${escape(reason)}`);
              note(`- **ACP registry check skipped:** ${reason}`);
            }
          '
